name: guad
description: "Guad GTD based task manager"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1
environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1

  # Routing
  go_router: ^13.0.1

  # HTTP
  dio: ^5.8.0
  flutter_appauth: ^12.0.2

  # Token refresh (local packages)
  fresh: 0.6.0
  fresh_dio: 0.6.0

  # Local storage helpers
  path_provider: ^2.1.4
  path: ^1.9.0

  # Secure storage
  flutter_secure_storage: ^9.2.4

  # Key-value storage
  shared_preferences: ^2.3.3

  # Connectivity
  connectivity_plus: ^6.1.4

  # Firebase
  firebase_core: ^3.13.0
  firebase_crashlytics: ^4.3.5
  firebase_messaging: ^15.2.5

  # Biometric auth
  local_auth: ^2.3.0

  # Charts
  fl_chart: ^0.69.0

  # Utilities
  equatable: ^2.0.7
  intl: any
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
