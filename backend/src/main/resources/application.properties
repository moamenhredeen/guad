server.port=8080
server.tomcat.max-part-count=100

spring.application.name=guad

spring.datasource.url=jdbc:postgresql://localhost:5432/guad_db
spring.datasource.username=guad_user
spring.datasource.password=guad_password

spring.data.web.pageable.default-page-size=25
spring.data.web.pageable.max-page-size=100

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=500MB

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-name=Guad Admin
spring.security.oauth2.client.registration.keycloak.client-id=guad-admin-backend
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ADMIN_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_APP_ISSUER_URI}

spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
spring.cloud.aws.s3.region=${AWS_REGION:us-east-1}
spring.cloud.aws.s3.bucket=${AWS_S3_BUCKET_NAME:aws-s3-tue-bucket}

logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

attachment.presigned-url-expiration-minutes=60
attachment.max-file-size-mb=50
attachment.allowed-mime-types=[image/jpeg, image/png, image/gif, image/webp, application/pdf, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/vnd.ms-excel, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, text/plain, text/csv]
